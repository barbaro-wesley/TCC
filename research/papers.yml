    country: "Ghana"
    frequency: "monthly"
    horizons: ["forecast exercise after January 2016-December 2023 sample"]
    models: ["ARIMA", "SARIMA"]
    relevant_findings:
      - "The paper compares seasonal and non-seasonal statistical baselines on 96 monthly observations."
      - "Its abstract favors SARIMA overall, while the reported diesel RMSE shown there is lower for ARIMA (0.9678 versus 1.0115)."
    limitations: ["Small monthly sample, different price-setting regime, and a nuanced metric-versus-summary result."]
