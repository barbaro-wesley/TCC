      evidence: "Both ARIMA and SARIMA are competitive in the reported Ghana exercise."
      inference: "Seasonality should be tested, not presumed."
      limitation: "The overall narrative does not imply SARIMA wins every diesel metric."
      implementation_consequence: "Select seasonal order inside folds and expose per-metric results rather than a single textual winner."
    verification: {status: "verified", checked_at: "2026-08-13", notes: "The diesel-RMSE nuance is retained rather than normalized away."}

