schema_version: "1.1"
catalog_as_of: "2026-08-13"
project: "Atlas S10"
scope: >-
  Evidence register for forecasting Brazilian Diesel S10 retail prices and for
  turning forecasts into auditable procurement support. A paper's inclusion is
  not an endorsement and reported scores are never treated as transferable.

verification_scale:
  verified: "Bibliographic identity and the claims used here were checked against a publisher, DOI record, institutional repository, or official working paper."
  partial: "The item exists, but at least one relevant claim, field, full text, code artifact, or experimental detail remains unchecked."
  conflicted: "Primary or publisher-facing artifacts disagree; both versions are retained and no silent resolution is made."

decision_rules:
  - "No model becomes champion because it won in a paper; it must beat Atlas baselines in nested temporal backtests."
  - "Any scaling, selection, tuning, calibration, stacking, or decomposition is fitted inside each training fold."
  - "Brazilian retail diesel evidence has higher domain relevance than crude-oil or fuel-sales evidence, but neither overrides local validation."
  - "Code availability and license must be verified before adapting an authors' implementation."

papers:
  - id: "R1"
    title: "Variable step-size evolving participatory learning with kernel recursive least squares applied to gas prices forecasting in Brazil"
    authors:
      - "Eduardo Ravaglia Campos Queiroz"
      - "Kaike Sa Teles Rocha Alves"
      - "Fernando Luiz Cyrino Oliveira"
      - "Eduardo Pestana de Aguiar"
    year: 2022
    online_first_year: 2021
    publication: "Evolving Systems 13(2), 297-306"
    doi: "10.1007/s12530-021-09388-z"
    url: "https://doi.org/10.1007/s12530-021-09388-z"
    related_material:
      - "https://www.maxwell.vrac.puc-rio.br/52507/52507.PDF"
      - "https://www.sba.org.br/open_journal_systems/index.php/cba/article/download/1039/1030/"
    target: "Brazilian retail prices for Diesel S10 and S500, with related fuel-price series"
    country: "Brazil"
    frequency: "weekly and monthly experiments"
    horizons: ["2 weeks", "4 weeks", "1 month", "6 months", "12 months"]
    models: ["VS-ePL-KRLS", "evolving participatory learning", "kernel recursive least squares"]
    relevant_findings:
      - "The study directly applies an adaptive evolving kernel method to Brazilian S10/S500 price forecasting."
      - "The related PUC-Rio dissertation supplies substantially more algorithmic and experimental detail than an abstract alone."
    limitations:
      - "Its data vintage, folds, baseline set, and operational objective are not identical to Atlas."
      - "An official code repository and reusable software license were not verified in this audit."
    how_we_use_it: "Experimental Brazil-specific challenger only after a faithful mathematical specification, implementation tests, and license review; never an automatic winner."
    assessment:
      evidence: "R1 studies VS-ePL-KRLS on Brazilian Diesel S10/S500 data."
      inference: "An online adaptive learner may help when pass-through relationships drift."
      limitation: "The paper does not establish superiority under Atlas's availability-aware nested rolling-origin protocol."
      implementation_consequence: "Label it 'VS-ePL-KRLS — Experimental' until reproduction parity is demonstrated; otherwise do not claim fidelity."
    verification:
      status: "verified"
      checked_at: "2026-08-13"
      notes: "Print year is 2022; DOI suffix and online-first record refer to 2021."

