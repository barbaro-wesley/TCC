  - id: "R4"
    title: "Predicting Petrol and Diesel Prices in Ghana, A Comparison of ARIMA and SARIMA Models"
    authors: ["Sampson Agyare", "Benjamin Odoi", "Eric Neebo Wiah"]
    year: 2024
