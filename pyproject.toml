[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-s10"
version = "0.1.0"
description = "Causal Diesel S10 procurement intelligence demo"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "statsmodels>=0.14.5,<1",
  "lightgbm>=4.6,<5",
  "duckdb>=1.3,<2",
  "pyarrow>=20,<30",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["atlas_s10*", "pipelines*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
