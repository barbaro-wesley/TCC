schema_version: "1.1"
manifest_as_of: "2026-08-13T00:00:00-03:00"
project: "Atlas S10"
manifest_purpose: >-
  Point-in-time source contract. Coverage and hashes describe the snapshots that
  were actually audited in this workspace, not whatever a live source happens to
  expose today.

required_observation_contract:
  fields:
    - "series_id"
    - "observation_date"
    - "available_at"
    - "ingested_at"
    - "value"
    - "unit"
    - "source"
    - "revision"
    - "geography"
    - "metadata"
  invariants:
    - "observation_date is not a substitute for available_at."
    - "Training snapshots must enforce available_at <= forecast_origin."
    - "ingested_at is the actual capture timestamp; filesystem mtime must not be promoted to ingested_at."
    - "Unknown historical release times remain unknown or use a documented conservative proxy; they are never backfilled from the current page timestamp."
    - "Raw bytes are immutable and addressed by SHA-256; transformations receive their own lineage records."
    - "Corrections are new revisions, not destructive overwrites."

status_vocabulary:
  cached_audited: "A local snapshot exists and its content/coverage was profiled."
  cached_provenance_gap: "A local snapshot exists, but original fetch URL/time or vintage history is incomplete."
  planned_official: "An official source was identified but no local snapshot was acquired."
  optional_blocked: "Optional input is not allowed to block the MVP."

global_caveats:
  - "No local source currently carries genuine row-level available_at, ingested_at, revision, or historical-vintage fields."
  - "Local file modification times are not reliable download timestamps; consequently last_sync is null for inherited snapshots."
  - "Latest_observation is a local-coverage fact, not a freshness claim about the upstream publisher."
  - "The existing processed target is Rio Grande do Sul; the audited raw ANP files also support a national primary target."

